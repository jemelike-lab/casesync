<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="st-bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="st-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#st-bg)" stroke="#f1f5f9" stroke-width="2"/>
  <g transform="translate(100 105)">
    <!-- two columns -->
    <g>
      <!-- left column -->
      <rect x="-46" y="-40" width="18" height="60" fill="url(#st-col)" stroke="#334155" stroke-width="1"/>
      <rect x="-50" y="-46" width="26" height="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <rect x="-50" y="20" width="26" height="8" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <!-- fluting -->
      <line x1="-42" y1="-40" x2="-42" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="-37" y1="-40" x2="-37" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="-32" y1="-40" x2="-32" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
      <!-- right column -->
      <rect x="28" y="-40" width="18" height="60" fill="url(#st-col)" stroke="#334155" stroke-width="1"/>
      <rect x="24" y="-46" width="26" height="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <rect x="24" y="20" width="26" height="8" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <line x1="32" y1="-40" x2="32" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="37" y1="-40" x2="37" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="42" y1="-40" x2="42" y2="20" stroke="#94a3b8" stroke-width="0.6"/>
    </g>
    <!-- pediment top -->
    <polygon points="-54,-46 54,-46 0,-66" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="-54,-46 54,-46 0,-58" fill="#cbd5e1" opacity="0.8"/>
    <!-- torch in middle -->
    <g transform="translate(0 -2)">
      <rect x="-2.5" y="0" width="5" height="22" fill="#475569"/>
      <ellipse cx="0" cy="-3" rx="6" ry="3" fill="#cbd5e1"/>
      <path d="M-7,-3 Q-9,-18 0,-26 Q9,-18 7,-3 Z" fill="#fbbf24"/>
      <path d="M-4,-3 Q-5,-15 0,-22 Q5,-15 4,-3 Z" fill="#fef3c7"/>
    </g>
  </g>
</svg>
