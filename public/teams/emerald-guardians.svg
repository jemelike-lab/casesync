<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eg-bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <linearGradient id="eg-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="eg-gem" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#eg-bg)" stroke="#bbf7d0" stroke-width="2"/>
  <g transform="translate(100 100)">
    <!-- shield -->
    <path d="M0,-58 L-46,-46 L-46,5 Q-46,42 0,60 Q46,42 46,5 L46,-46 Z" fill="url(#eg-shield)" stroke="#064e3b" stroke-width="2.5"/>
    <!-- shield inner border -->
    <path d="M0,-50 L-38,-40 L-38,3 Q-38,36 0,52 Q38,36 38,3 L38,-40 Z" fill="none" stroke="#064e3b" stroke-width="1" opacity="0.4"/>
    <!-- center emerald gem -->
    <g transform="translate(0 0)">
      <polygon points="0,-25 -18,-5 -14,18 14,18 18,-5" fill="url(#eg-gem)" stroke="#064e3b" stroke-width="1.5"/>
      <polygon points="0,-25 -18,-5 0,-5" fill="#bbf7d0" opacity="0.7"/>
      <polygon points="0,-25 18,-5 0,-5" fill="#34d399" opacity="0.9"/>
      <line x1="0" y1="-25" x2="0" y2="18" stroke="#064e3b" stroke-width="0.8" opacity="0.6"/>
      <line x1="-18" y1="-5" x2="18" y2="-5" stroke="#064e3b" stroke-width="0.8" opacity="0.6"/>
      <polygon points="-14,18 0,-5 14,18" fill="#047857" opacity="0.5"/>
    </g>
    <!-- crossed laurel branches at top -->
    <g stroke="#fbbf24" stroke-width="1.5" fill="#fde68a">
      <ellipse cx="-22" cy="-46" rx="3" ry="6" transform="rotate(-30 -22 -46)"/>
      <ellipse cx="-16" cy="-50" rx="3" ry="6" transform="rotate(-30 -16 -50)"/>
      <ellipse cx="22" cy="-46" rx="3" ry="6" transform="rotate(30 22 -46)"/>
      <ellipse cx="16" cy="-50" rx="3" ry="6" transform="rotate(30 16 -50)"/>
    </g>
  </g>
</svg>
